<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="./ExpenseTracker.css">
</head>

<body>

    <div class="container">

        <h1>Expense Tracker</h1>

        <!-- =========================
             SUMMARY
        ========================== -->

        <div class="summary">

            <div class="summary-card">
                <h3>Balance</h3>
                <p id="balance">$0.00</p>
            </div>

            <div class="summary-card income">
                <h3>Income</h3>
                <p id="income">$0.00</p>
            </div>

            <div class="summary-card expense">
                <h3>Expenses</h3>
                <p id="expenses">$0.00</p>
            </div>

        </div>


        <!-- =========================
             ADD TRANSACTION FORM
        ========================== -->

        <div class="form-container">

            <h2>Add Transaction</h2>

            <form id="transactionForm">

                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <input
                        type="text"
                        id="description"
                        placeholder="e.g. Salary, Food, Rent"
                    >

                </div>


                <div class="form-group">

                    <label for="amount">
                        Amount
                    </label>

                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        step="0.01"
                    >

                </div>


                <div class="form-group">

                    <label for="type">
                        Transaction Type
                    </label>

                    <select id="type">

                        <option value="income">
                            Income
                        </option>

                        <option value="expense">
                            Expense
                        </option>

                    </select>

                </div>


                <button type="submit">
                    Add Transaction
                </button>

            </form>

        </div>


        <!-- =========================
             TRANSACTION LIST
        ========================== -->

        <div class="transactions">

            <h2>Transactions</h2>

            <div id="transactionList">

                <!-- JavaScript will add transactions here -->

            </div>

        </div>

    </div>

    <script src="./practiceexpense.js"></script>

</body>
</html>
